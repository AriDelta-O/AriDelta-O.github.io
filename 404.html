<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>404 | AriDeltaO</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&family=Syne:wght@700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:#0d0d0f; color:#eaeaea;
      font-family:'DM Sans',system-ui,sans-serif;
      display:flex; align-items:center; justify-content:center;
      min-height:100vh; text-align:center;
    }
    .wrap { max-width:480px; padding:2rem; }
    .code {
      font-family:'Syne',sans-serif;
      font-size:8rem; font-weight:700;
      color:#ff4d4d; line-height:1;
      letter-spacing:-0.04em;
    }
    h1 { font-size:1.4rem; margin:1rem 0 .5rem; font-weight:600; }
    p { color:#9aa0a6; line-height:1.6; margin-bottom:1.5rem; }
    a {
      display:inline-block; padding:.6rem 1.4rem;
      background:#ff4d4d; color:#0d0d0f;
      border-radius:999px; text-decoration:none;
      font-weight:600; font-size:.9rem;
      transition:opacity .2s;
    }
    a:hover { opacity:.85; }
    body.light{ background:#f2f2f4; color:#111; }
    body.light h1{ color:#111; }
    body.light p{ color:#666; }
    .theme-toggle{ position:fixed; top:1rem; right:1rem; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.12); border-radius:999px; width:38px; height:38px; font-size:1.1rem; cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:100; transition:background .2s; }
    .theme-toggle:hover{ background:rgba(255,255,255,0.15); }
    body.light .theme-toggle{ background:rgba(0,0,0,0.05); border-color:rgba(0,0,0,0.1); }
    body.light .theme-toggle:hover{ background:rgba(0,0,0,0.1); }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle light/dark theme">🌙</button>
  <div class="wrap">
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <a href="/">Back to Portfolio</a>
  </div>
  <script>
  (function(){
    var t=document.getElementById('themeToggle');
    if(localStorage.getItem('theme')==='light'){document.body.classList.add('light');t.textContent='☀️';}
    t.addEventListener('click',function(){
      var l=document.body.classList.toggle('light');
      localStorage.setItem('theme',l?'light':'dark');
      t.textContent=l?'☀️':'🌙';
    });
  })();
  </script>
</body>
</html>
